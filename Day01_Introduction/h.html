<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo HTML Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Demo Website</h1>
  </header>
  <main>
    <h2>Hello, World! 👋</h2>
    <p>This is a simple demo HTML file with CSS and JavaScript.</p>
    <button onclick="showMessage()">Click Me</button>
    <p id="message"></p>
  </main>
  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Button clicked successfully! Thank you for visiting.";
    }
    function start() {
        alert("Welcome! You are ready to go.");
    }
    function execute() {
        start();
    }
    function init() {
        const startButton = document.querySelector("button");
        startButton.addEventListener("click", execute);
    }
    window.addEventListener("DOMContentLoaded", init);
    webkitURL = window.URL || window.webkitURL;
    window.URL = webkitURL;
  </script>
</body>
</html>
